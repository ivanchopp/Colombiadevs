# Configuración de despliegue en Railway (spec paneles-y-despliegue, PD8).
# Confirmar los nombres de las claves con la documentación vigente de Railway.
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python init_db.py && streamlit run app/main.py --server.port $PORT --server.address 0.0.0.0 --server.headless true"
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
